# Multi-OS build + GitHub Release on version tags.
#
#   git tag v1.2.0
#   git push origin v1.2.0

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for packaging (e.g. 1.2.0). Ignored on tag pushes.'
        required: false
        default: '1.2.0'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            binary: dygma-sd-plugin.exe
            artifact: binary-windows
          - name: macos
            os: macos-latest
            binary: dygma-sd-plugin
            artifact: binary-macos
          - name: linux
            os: ubuntu-latest
            binary: dygma-sd-plugin
            artifact: binary-linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Linux serial build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugin
          key: ${{ matrix.name }}

      - name: Test
        working-directory: plugin
        run: cargo test --release

      - name: Build release
        working-directory: plugin
        run: cargo build --release

      - name: Stage binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-bin
          SRC="plugin/target/release/${{ matrix.binary }}"
          if [[ ! -f "$SRC" ]]; then
            # Windows may produce .exe; unix has no extension
            if [[ -f "plugin/target/release/dygma-sd-plugin" ]]; then
              SRC="plugin/target/release/dygma-sd-plugin"
            elif [[ -f "plugin/target/release/dygma-sd-plugin.exe" ]]; then
              SRC="plugin/target/release/dygma-sd-plugin.exe"
            else
              echo "Missing release binary" >&2
              ls -la plugin/target/release/ || true
              exit 1
            fi
          fi
          cp "$SRC" "dist-bin/${{ matrix.binary }}"
          chmod +x "dist-bin/${{ matrix.binary }}" || true
          ls -la dist-bin/

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-bin/*
          if-no-files-found: error

  package:
    name: Package & release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" == v* ]]; then
            v="${GITHUB_REF_NAME}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            v="${{ github.event.inputs.version }}"
            [[ "$v" == v* ]] || v="v$v"
          else
            v="v0.0.0-dev"
          fi
          bare="${v#v}"
          # Stream Deck wants up to 4 numeric segments
          IFS='.' read -r a b c d <<< "${bare}.0.0.0"
          plugin_version="${a}.${b}.${c:-0}.${d:-0}"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          echo "plugin_version=$plugin_version" >> "$GITHUB_OUTPUT"
          echo "tag=$v plugin_version=$plugin_version"

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble multi-OS plugin
        shell: bash
        run: |
          set -euo pipefail
          SD="plugin/red.eminence.dygma.battery.sdPlugin"
          BIN="$SD/bin"
          mkdir -p "$BIN"
          cp artifacts/binary-windows/dygma-sd-plugin.exe "$BIN/"
          cp artifacts/binary-macos/dygma-sd-plugin "$BIN/dygma-sd-plugin-mac"
          cp artifacts/binary-linux/dygma-sd-plugin "$BIN/dygma-sd-plugin-linux"
          chmod +x "$BIN/dygma-sd-plugin-mac" "$BIN/dygma-sd-plugin-linux"

          VER="${{ steps.ver.outputs.plugin_version }}"
          python3 - <<PY
          import json, pathlib
          p = pathlib.Path("plugin/red.eminence.dygma.battery.sdPlugin/manifest.json")
          m = json.loads(p.read_text(encoding="utf-8"))
          m["Version"] = "$VER"
          m["SDKVersion"] = 3
          m["Software"] = {"MinimumVersion": "7.3"}
          m["CodePath"] = "bin/dygma-sd-plugin-mac"
          m["CodePathWin"] = "bin/dygma-sd-plugin.exe"
          m["CodePathMac"] = "bin/dygma-sd-plugin-mac"
          m["CodePathLin"] = "bin/dygma-sd-plugin-linux"
          m["OS"] = [
            {"Platform": "windows", "MinimumVersion": "10"},
            {"Platform": "mac", "MinimumVersion": "10.15"},
            {"Platform": "linux", "MinimumVersion": "20.04"},
          ]
          p.write_text(json.dumps(m, indent=2) + "\n", encoding="utf-8")
          print(p.read_text())
          PY
          ls -la "$BIN"

      - name: Pack zip artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          SD_NAME="red.eminence.dygma.battery.sdPlugin"
          SD_PATH="plugin/$SD_NAME"
          # .sdPlugin.zip (folder at zip root)
          (cd plugin && zip -r "../dist/${SD_NAME}.zip" "$SD_NAME" -x '*/bin/.gitkeep')
          # .streamDeckPlugin is a zip of the folder (Elgato install format)
          (cd plugin && zip -r "../dist/red.eminence.dygma.battery.streamDeckPlugin" "$SD_NAME")
          ls -la dist/

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dygma-sd-plugin
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.streamDeckPlugin
            dist/*.zip
          body: |
            ## Install

            1. Download **`red.eminence.dygma.battery.streamDeckPlugin`** (preferred).
            2. Double-click to install into Stream Deck (**Windows** primary; **macOS beta**).
            3. Add **Dygma Battery → Dygma Battery** to a key.
            4. **Close Bazecor** while the plugin owns the Neuron serial port.

            Fallback: download `*.sdPlugin.zip` and extract into the Stream Deck Plugins folder:

            | OS | Plugins folder |
            |----|----------------|
            | Windows | `%APPDATA%\Elgato\StreamDeck\Plugins\` |
            | macOS (beta) | `~/Library/Application Support/com.elgato.StreamDeck/Plugins/` |
            | Linux | Community hosts only; binary for experiments / `--self-test` |

            ## Platforms

            Multi-OS package (Windows + macOS + Linux binaries).

            - **Windows:** primary / verified (**Stream Deck 7.3+**).
            - **macOS:** **beta** (Stream Deck 7.3+).
            - **Linux:** experimental (no official Elgato app).
            - **Boards:** **Defy** verified; **Raise 2** and **Sonsei** wireless are **beta**.
            - **SDKVersion 3** + MinVersion **7.3** — Marketplace **DRM-ready**.

            ## Notes

            - Neuron USB + RF sides required (not pure Bluetooth).
            - Unofficial community plugin; Dygma logo used with permission. No warranty; use at your own risk.
            - See README for multi-device picker and build-from-source.
            - Focus API: [crimsonvspurple/dygma-focus](https://github.com/crimsonvspurple/dygma-focus).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
