[package]
name = "dygma-sd-plugin"
version = "0.1.0"
edition = "2021"
description = "Stream Deck plugin: Dygma Defy wireless battery via Focus"
license = "MIT"
publish = false

[dependencies]
base64 = "0.22"
dygma_focus = "0.5"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
streamdeck-rs = { version = "0.8", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
