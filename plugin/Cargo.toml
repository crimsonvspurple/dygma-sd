[package]
name = "dygma-sd-plugin"
version = "1.5.1"
edition = "2021"
description = "Stream Deck plugin: Dygma wireless battery via Focus (Defy verified; Raise 2 / Sonsei beta; macOS beta)"
license = "MIT"
publish = false

[lib]
name = "dygma_sd_plugin"
path = "src/lib.rs"

[[bin]]
name = "dygma-sd-plugin"
path = "src/main.rs"

[[bin]]
name = "gen-marketplace"
path = "src/bin/gen_marketplace.rs"
required-features = ["gen-marketplace"]

[features]
default = []
# Rasterize Elgato Marketplace PNGs (SVG key art from visual.rs + banners).
# cargo run --features gen-marketplace --bin gen-marketplace
gen-marketplace = ["dep:resvg", "dep:anyhow"]

[dependencies]
base64 = "0.22"
# Fork of dygma_focus: crates.io 0.5.x pulls an unused `windows` crate and does
# not build on macOS/Linux. See https://github.com/crimsonvspurple/dygma-focus
dygma_focus = { git = "https://github.com/crimsonvspurple/dygma-focus", rev = "7e70c6a3d9f0860c53fbb6a677e36606913da6cc" }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
streamdeck-rs = { version = "0.8", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Optional: marketplace asset generator only
anyhow = { version = "1", optional = true }
resvg = { version = "0.45", optional = true, default-features = true }

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
